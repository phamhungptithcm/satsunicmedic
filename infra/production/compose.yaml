name: satsunicmedic
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  postgres:
    image: ${POSTGRES_IMAGE:?pinned image required}
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    environment:
      POSTGRES_DB: humanscope
      POSTGRES_USER: humanscope
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres:/var/lib/postgresql]
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U humanscope -d humanscope']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
  api:
    image: ${API_IMAGE:?pinned image required}
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [api.env]
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      NODE_ENV: production
      PORT: '8080'
      HOST: 0.0.0.0
      APP_ORIGIN: https://${PUBLIC_HOST}
      FIREBASE_PROJECT_ID: satsunicmedic
      ASSET_DELIVERY_ENABLED: 'false'
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:8080/api/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  web:
    image: ${WEB_IMAGE:?pinned image required}
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      API_ORIGIN: http://api:8080
      ADSENSE_ENABLED: 'false'
      ADSENSE_SITE_APPROVED: 'false'
    depends_on:
      api: {condition: service_healthy}
    logging: *logging
  proxy:
    image: ${CADDY_IMAGE:?pinned image required}
    restart: unless-stopped
    mem_limit: 96m
    pids_limit: 64
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    depends_on: [web]
    logging: *logging
  migrate:
    image: ${MIGRATE_IMAGE:?pinned image required}
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    profiles: [tools]
    env_file: [migrate.env]
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
    logging: *logging
secrets:
  db_password:
    file: ./db_password
volumes:
  postgres:
  caddy_data:
  caddy_config:
