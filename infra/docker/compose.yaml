services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: humanscope
      POSTGRES_USER: humanscope
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:5442:5432"]
    volumes: ["humanscope-pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanscope"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  humanscope-pg:
