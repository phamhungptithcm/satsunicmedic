packages:
  - apps/*
  - packages/*
allowBuilds:
  '@firebase/util': false
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-express@12.1.2'
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - next@16.3.8
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - vitest@5.0.3
overrides:
  'deepmerge-ts@<8.0.0': 8.0.0
  'mysql2@<3.23.1': 3.23.1
  '@grpc/grpc-js@<1.13.6': 1.14.5
  'uuid@9.0.1': 11.1.1
