name: Verify foundation
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8189
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_PROJECT_ID: demo-humanscope
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@11.19.0 firebase-tools@15.32.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/acceptance-production.mjs run typecheck
      - run: node scripts/ci/acceptance-production.mjs run lint
      - run: node scripts/ci/acceptance-production.mjs run unit
      - run: node scripts/ci/acceptance-production.mjs run integration
      - run: node scripts/ci/acceptance-production.mjs run build
      - name: Retain technical check receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-verify-${{ github.run_id }}
          path: |
            .ai/local/acceptance/typecheck.json
            .ai/local/acceptance/lint.json
            .ai/local/acceptance/unit.json
            .ai/local/acceptance/integration.json
            .ai/local/acceptance/build.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  source-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install -r scripts/free-anatomy/requirements-audit.txt
      - run: .audit-venv/bin/python -m unittest discover -s tests -p 'test_*audit.py'
      - run: .audit-venv/bin/python -m unittest discover -s tests/free-anatomy -p 'test_*.py'
# Production invokes this reusable workflow at the same commit before deployment.
# Verification jobs have read-only permissions and no cloud credentials.
