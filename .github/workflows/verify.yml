name: Verify foundation
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8189
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_PROJECT_ID: demo-humanscope
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@11.19.0 firebase-tools@15.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec eslint scripts/ci/*.mjs
      - run: pnpm test
      - run: firebase emulators:exec --only auth,firestore --project demo-humanscope --config infra/firebase/firebase.json 'pnpm test:integration'
      - run: pnpm build
      # Use tsc output: tsx does not emit Nest decorator metadata for path parameters.
      - run: pnpm --filter @hs/api exec node dist/openapi.js
      - run: git diff --exit-code -- docs/implementation/openapi.json
  source-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install -r scripts/free-anatomy/requirements-audit.txt
      - run: .audit-venv/bin/python -m unittest discover -s tests -p 'test_*audit.py'
      - run: .audit-venv/bin/python -m unittest discover -s tests/free-anatomy -p 'test_*.py'
# Production invokes this reusable workflow at the same commit before deployment.
# Verification jobs have read-only permissions and no cloud credentials.
